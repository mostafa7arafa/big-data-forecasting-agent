[project]
name = "analyst"
version = "0.1.0"
description = "Dataset-agnostic AI data analyst library"
authors = [
    { name = "Mostafa Arafa", email = "a.mostafa190@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.37",
    "duckdb==2.0.0",
    "langchain>=1.5,<1.6",
    "langchain-openai>=1.7.4,<1.8",
    "langchain-openrouter==0.2.9",
    "langgraph>=1.2.21,<1.3",
    "langsmith>=0.14.17,<0.15",
    "openevals==0.2.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "statsforecast>=2.0.1",
    "utilsforecast>=0.2.17",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.43,<0.5",
    "pytest>=9.2.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    'ignore:^possible convergence problem\x3a minimize gave code [0-9]+\]$:UserWarning:statsforecast.arima',
]
markers = [
    "taxi: tests that require data/raw NYC taxi files",
    "slow: long-running tests",
    "docker: needs a Docker daemon and the analyst-sandbox image (make sandbox-image)",
    "live: needs API keys and starts langgraph dev (uv run pytest -m live tests/live)",
]
